<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="utils.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Cart</h1>
      <nav>
        <ul>
          <li><a href="index.html">Catalog</a></li>
          <li><a href="#">Cart</a></li>
          <li><a href="Login.html">Login</a></li>
          <li><a href="Register.html">Register</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <div class="card">
      <section class="cart">
        <div class="cart-products">
          <img src="images/sofa.jpg" alt="sofa">
          <div class="details">
            <div class="info">
              <h2>Sofa</h2>
              <p>1,00,000 Rs/-</p>
            </div>
            <button>Remove</button>
          </div>
        </div>
        <div class="cart-products">
          <img src="images/watch.jpg" alt="watch">
          <div class="details">
            <div class="info">
              <h2>Watch</h2>
              <p>1,00,000 Rs/-</p>
            </div>
            <button>Remove</button>
          </div>
        </div>
        <div class="total">
          <h3>Total: 2,00,000.00 Rs/-</h3>
          <button>Checkout</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
