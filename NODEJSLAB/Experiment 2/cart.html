<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS for Background Color -->
  <style>
    body {
      background-color: #e6f7ff; /* Light Blue */
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white py-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Cart</h1>
        <nav>
          <ul class="list-unstyled d-flex mb-0">
            <li class="me-3"><a href="index.html" class="text-white text-decoration-none">Catalog</a></li>
            <li class="me-3"><a href="#" class="text-white text-decoration-none">Cart</a></li>
            <li class="me-3"><a href="Login.html" class="text-white text-decoration-none">Login</a></li>
            <li><a href="Register.html" class="text-white text-decoration-none">Register</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <main class="py-5">
    <div class="container">
      <div class="row">
        <div class="col-md-8">
          <!-- Cart Items -->
          <div class="card mb-3">
            <div class="row g-0">
              <div class="col-md-4">
                <img src="images/sofa.jpg" class="img-fluid rounded-start" alt="Sofa">
              </div>
              <div class="col-md-8">
                <div class="card-body">
                  <h5 class="card-title">Sofa</h5>
                  <p class="card-text">1,00,000 Rs/-</p>
                  <button class="btn btn-danger">Remove</button>
                </div>
              </div>
            </div>
          </div>
          <!-- Repeat for other cart items -->
        </div>
        <div class="col-md-4">
          <!-- Total and Checkout -->
          <div class="card">
            <div class="card-body">
              <h3 class="card-title">Total: 2,00,000.00 Rs/-</h3>
              <button class="btn btn-primary w-100">Checkout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
