<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS for Background Color -->
  <style>
    body {
      background-color: #e6f7ff; /* Light Blue */
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white py-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Register Here</h1>
        <nav>
          <ul class="list-unstyled d-flex mb-0">
            <li class="me-3"><a href="index.html" class="text-white text-decoration-none">Catalog</a></li>
            <li class="me-3"><a href="cart.html" class="text-white text-decoration-none">Cart</a></li>
            <li class="me-3"><a href="Login.html" class="text-white text-decoration-none">Login</a></li>
            <li><a href="#" class="text-white text-decoration-none">Register</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title text-center">Register</h2>
              <form onsubmit="return validateRegisterForm()">
                <div class="mb-3">
                  <input id="username" type="text" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                  <input id="email" type="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-3">
                  <input id="password" type="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="mb-3">
                  <input id="confirmpassword" type="password" class="form-control" placeholder="Confirm Password" required>
                </div>
                <div class="mb-3">
                  <input id="number" type="number" class="form-control" placeholder="Mobile Number" required>
                </div>
                <div class="mb-3">
                  <input id="age" type="number" class="form-control" placeholder="Age">
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="validation.js"></script>
</body>
</html>
