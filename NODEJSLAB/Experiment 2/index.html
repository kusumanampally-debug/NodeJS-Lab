<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS for Background Color -->
  <style>
    body {
      background-color: #e6f7ff; /* Light Blue */
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white py-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Catalog</h1>
        <nav>
          <ul class="list-unstyled d-flex mb-0">
            <li class="me-3"><a href="#" class="text-white text-decoration-none">Catalog</a></li>
            <li class="me-3"><a href="cart.html" class="text-white text-decoration-none">Cart</a></li>
            <li class="me-3"><a href="Login.html" class="text-white text-decoration-none">Login</a></li>
            <li><a href="Register.html" class="text-white text-decoration-none">Register</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <main class="py-5">
    <div class="container">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <!-- Product Cards -->
        <div class="col">
          <div class="card h-100 text-center">
            <img src="./images/washing_machine.jpg" class="card-img-top" alt="Washing Machine">
            <div class="card-body">
              <h5 class="card-title">Washing Machine</h5>
              <button class="btn btn-success">Add to Cart</button>
            </div>
          </div>
        </div>
        <!-- Add more products as needed -->
      </div>
    </div>
  </main>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Add to Cart Functionality
    document.querySelectorAll(".btn-success").forEach((button) => {
      button.addEventListener("click", () => {
        const productName = button.parentElement.querySelector(".card-title").textContent;
        alert(`${productName} added to cart!`);
      });
    });
  </script>
</body>
</html>
